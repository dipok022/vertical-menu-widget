<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Group</title>
    <link rel="stylesheet" href="./scss/button-group.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Design 1  -->
    <section style="background-color: #f4f6fa; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 1</h2>

        <div class="thha-button-group thha-presets-1">
          <div class="thha-bg-cart" data-state="bg_group">
            <button
              type="button"
              class="thha-bg-cart__face thha-bg-cart__face--idle"
              aria-label="Add to cart"
            >
              <i class="fa-solid fa-cart-shopping"></i>
              <span>ADD TO CART</span>
            </button>
            <span class="thha-bg-cart__face thha-bg-cart__face--qty">
              <button
                type="button"
                class="thha-bg-step"
                data-step="-1"
                aria-label="Decrease"
              >
                <i class="fa-solid fa-minus"></i>
              </button>
              <span class="thha-bg-qty" aria-live="polite">1</span>
              <button
                type="button"
                class="thha-bg-step"
                data-step="1"
                aria-label="Increase"
              >
                <i class="fa-solid fa-plus"></i>
              </button>
              <button
                type="button"
                class="thha-bg-confirm"
                aria-label="Add to cart"
              >
                <i class="fa-solid fa-cart-shopping"></i>
                <i class="fa-solid fa-check"></i>
              </button>
            </span>
          </div>

          <div class="thha-bg-row">
            <div class="thha-bg-cell"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Design 2  -->
    <section style="background-color: #ffffff; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 2</h2>

        <div class="thha-button-group thha-presets-2">
          <button type="button" class="thha-bg-like" aria-pressed="false">
            <span class="thha-bg-like__main">
              <span class="thha-bg-heart" aria-hidden="true">
                <i class="fa-regular fa-heart thha-bg-heart--outline"></i>
                <i class="fa-solid fa-heart thha-bg-heart--solid"></i>
              </span>
              <span class="thha-bg-like__label">LIKE</span>
            </span>
            <span class="thha-bg-like__count" data-count="492">492</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Design 3  -->
    <section style="background-color: #f8fafc; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 3</h2>

        <div class="thha-button-group thha-presets-3">
          <button
            type="button"
            class="thha-bg-play"
            data-state="paused"
            aria-label="Play"
          >
            <span class="thha-bg-play__icon" aria-hidden="true">
              <i class="fa-solid fa-play"></i>
              <i class="fa-solid fa-pause"></i>
            </span>
            <span class="thha-bg-play__label">PLAY</span>
            <span class="thha-bg-play__time">
              <span class="thha-bg-play__current">0:00</span>
              <span class="thha-bg-play__sep"> / </span>
              <span class="thha-bg-play__total">5:23</span>
            </span>
            <span class="thha-bg-play__progress" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- Design 4 : Toggle / Rating Groups -->
    <section style="background-color: #ffffff; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 4</h2>

        <div class="thha-button-group thha-presets-4">
          <div class="thha-bg-split" data-split="save">
            <button type="button" class="thha-bg-split__main">
              <i class="fa-solid fa-bookmark"></i>
              <span>Save</span>
              <span
                class="thha-bg-split__badge thha-bg-split__badge--violet"
                data-count="36"
                >36</span
              >
            </button>
            <button
              type="button"
              class="thha-bg-split__more"
              aria-label="More save options"
            >
              <i class="fa-solid fa-chevron-down"></i>
            </button>
            <ul class="thha-bg-split__menu">
              <li>
                <i class="fa-regular fa-folder-open"></i>Save to collection
              </li>
              <li><i class="fa-regular fa-clock"></i>Save for later</li>
              <li><i class="fa-solid fa-share-nodes"></i>Save &amp; share</li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <!-- Design 5  -->
    <section style="background-color: #f4f6fa; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 5</h2>

        <div class="thha-button-group thha-presets-5"></div>
      </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./js/button-group.js"></script>
  </body>
</html>
