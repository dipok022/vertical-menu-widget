<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketing Buttons</title>
    <link rel="stylesheet" href="./scss/marketing-buttons.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Design 1 : Cursor-Tracked Spotlight Border CTA -->
    <section style="background-color: #f4f6fa; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 1</h2>

        <div class="thha-marketing-buttons thha-presets-1">
          <a href="#" class="thha-mb-spot" data-thha-spotlight>
            <span class="thha-mb-spot-body">
              <span class="thha-mb-spot-label">Get Started Free</span>
              <span class="thha-mb-spot-icon" aria-hidden="true">
                <i class="fa-solid fa-arrow-right"></i>
                <i class="fa-solid fa-arrow-right"></i>
              </span>
            </span>
          </a>

          <a
            href="#"
            class="thha-mb-spot thha-mb-spot--sunset"
            data-thha-spotlight
          >
            <span class="thha-mb-spot-body">
              <span class="thha-mb-spot-label">Claim Your Offer</span>
              <span class="thha-mb-spot-icon" aria-hidden="true">
                <i class="fa-solid fa-bolt"></i>
                <i class="fa-solid fa-bolt"></i>
              </span>
            </span>
          </a>

          <a
            href="#"
            class="thha-mb-spot thha-mb-spot--emerald"
            data-thha-spotlight
          >
            <span class="thha-mb-spot-body">
              <span class="thha-mb-spot-label">Try It Now</span>
              <span class="thha-mb-spot-icon" aria-hidden="true">
                <i class="fa-solid fa-arrow-right"></i>
                <i class="fa-solid fa-arrow-right"></i>
              </span>
            </span>
          </a>
        </div>
      </div>
    </section>

    <!-- Design 2 : Per-Letter Roll CTA with rising fill -->
    <section style="background-color: #ffffff; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 2</h2>

        <div class="thha-marketing-buttons thha-presets-2">
          <a href="#" class="thha-mb-roll" aria-label="Buy now for $49">
            <span class="thha-mb-roll-icon" aria-hidden="true">
              <i class="fa-solid fa-bag-shopping"></i>
            </span>
            <span class="thha-mb-roll-text" data-thha-split aria-hidden="true"
              >Buy Now — $49</span
            >
          </a>

          <a
            href="#"
            class="thha-mb-roll thha-mb-roll--pink"
            aria-label="Download app"
          >
            <span class="thha-mb-roll-icon" aria-hidden="true">
              <i class="fa-solid fa-download"></i>
            </span>
            <span class="thha-mb-roll-text" data-thha-split aria-hidden="true"
              >Download App</span
            >
          </a>

          <a
            href="#"
            class="thha-mb-roll thha-mb-roll--blue"
            aria-label="Watch demo"
          >
            <span class="thha-mb-roll-icon" aria-hidden="true">
              <i class="fa-solid fa-circle-play"></i>
            </span>
            <span class="thha-mb-roll-text" data-thha-split aria-hidden="true"
              >Watch Demo</span
            >
          </a>
        </div>
      </div>
    </section>

    <!-- Design 3 : Aurora Glass CTA -->
    <section style="background-color: #0b1020; padding: 110px 0">
      <div class="container">
        <h2 class="header-title">Design 3</h2>

        <div class="thha-marketing-buttons thha-presets-3">
          <a href="#" class="thha-mb-aurora">
            <span class="thha-mb-aurora-field" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
            <span class="thha-mb-aurora-body">
              <i class="fa-solid fa-crown" aria-hidden="true"></i>
              <span>Upgrade to Pro</span>
            </span>
          </a>

          <a href="#" class="thha-mb-aurora thha-mb-aurora--cyan">
            <span class="thha-mb-aurora-field" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
            <span class="thha-mb-aurora-body">
              <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
              <span>Get Premium</span>
            </span>
          </a>
        </div>
      </div>
    </section>

    <!-- Design 4 : Proximity-Magnetic CTA with parallax arrow -->
    <section style="background-color: #f4f6fa; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 4</h2>

        <div class="thha-marketing-buttons thha-presets-4">
          <a href="#" class="thha-mb-magnet" data-thha-magnet>
            <span class="thha-mb-magnet-inner">
              <span class="thha-mb-magnet-label">Learn More</span>
              <span class="thha-mb-magnet-arrow" aria-hidden="true">
                <i class="fa-solid fa-arrow-right"></i>
                <i class="fa-solid fa-arrow-right"></i>
              </span>
            </span>
          </a>

          <a
            href="#"
            class="thha-mb-magnet thha-mb-magnet--solid"
            data-thha-magnet
          >
            <span class="thha-mb-magnet-inner">
              <span class="thha-mb-magnet-label">Book a Demo</span>
              <span class="thha-mb-magnet-arrow" aria-hidden="true">
                <i class="fa-solid fa-arrow-right"></i>
                <i class="fa-solid fa-arrow-right"></i>
              </span>
            </span>
          </a>
        </div>
      </div>
    </section>

    <!-- Design 5 : Progress-Ring Morphing CTA -->
    <section style="background-color: #f8fafc; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 5</h2>

        <div class="thha-marketing-buttons thha-presets-5">
          <button
            type="button"
            class="thha-mb-morph"
            data-thha-morph
            data-state="idle"
            data-label-busy="Subscribing"
            data-label-done="Subscribed"
          >
            <span class="thha-mb-morph-face thha-mb-morph-face--idle">
              <span class="thha-mb-morph-icon" aria-hidden="true">
                <span class="thha-mb-morph-trail"></span>
                <i class="fa-solid fa-paper-plane"></i>
                <i class="fa-solid fa-paper-plane"></i>
              </span>
              <span>Subscribe Now</span>
            </span>
            <span
              class="thha-mb-morph-face thha-mb-morph-face--busy"
              aria-hidden="true"
            >
              <svg class="thha-mb-morph-ring" viewBox="0 0 44 44">
                <circle class="thha-mb-morph-ring-track" cx="22" cy="22" r="19" />
                <circle class="thha-mb-morph-ring-bar" cx="22" cy="22" r="19" />
              </svg>
            </span>
            <span
              class="thha-mb-morph-face thha-mb-morph-face--done"
              aria-hidden="true"
            >
              <svg class="thha-mb-morph-check" viewBox="0 0 44 44">
                <path d="M13 22.5 19.5 29 31 16.5" />
              </svg>
            </span>
          </button>

          <button
            type="button"
            class="thha-mb-morph thha-mb-morph--violet"
            data-thha-morph
            data-state="idle"
            data-label-busy="Starting your trial"
            data-label-done="Trial started"
          >
            <span class="thha-mb-morph-face thha-mb-morph-face--idle">
              <span class="thha-mb-morph-icon" aria-hidden="true">
                <span class="thha-mb-morph-trail"></span>
                <i class="fa-solid fa-rocket"></i>
                <i class="fa-solid fa-rocket"></i>
              </span>
              <span>Start Free Trial</span>
            </span>
            <span
              class="thha-mb-morph-face thha-mb-morph-face--busy"
              aria-hidden="true"
            >
              <svg class="thha-mb-morph-ring" viewBox="0 0 44 44">
                <circle class="thha-mb-morph-ring-track" cx="22" cy="22" r="19" />
                <circle class="thha-mb-morph-ring-bar" cx="22" cy="22" r="19" />
              </svg>
            </span>
            <span
              class="thha-mb-morph-face thha-mb-morph-face--done"
              aria-hidden="true"
            >
              <svg class="thha-mb-morph-check" viewBox="0 0 44 44">
                <path d="M13 22.5 19.5 29 31 16.5" />
              </svg>
            </span>
          </button>

          <!-- screen-reader announcements for the morph state machine -->
          <span class="thha-mb-sr-status" role="status" aria-live="polite"></span>
        </div>
      </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./js/marketing-buttons.js"></script>
  </body>
</html>
