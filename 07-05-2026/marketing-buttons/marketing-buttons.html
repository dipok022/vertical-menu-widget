<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketing Buttons</title>
    <link rel="stylesheet" href="./scss/marketing-buttons.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Design 1 : Animated Gradient Shimmer CTA -->
    <section style="background-color: #f4f6fa; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 1</h2>

        <div class="thha-marketing-buttons thha-presets-1">
          <a href="#" class="thha-mb-shine">
            <span class="thha-mb-shine-text">Get Started Free</span>
            <span class="thha-mb-shine-icon" aria-hidden="true">
              <i class="fa-solid fa-arrow-right"></i>
            </span>
          </a>

          <a href="#" class="thha-mb-shine thha-mb-shine--sunset">
            <span class="thha-mb-shine-text">Claim Your Offer</span>
            <span class="thha-mb-shine-icon" aria-hidden="true">
              <i class="fa-solid fa-bolt"></i>
            </span>
          </a>

          <a href="#" class="thha-mb-shine thha-mb-shine--emerald">
            <span class="thha-mb-shine-text">Try It Now</span>
            <span class="thha-mb-shine-icon" aria-hidden="true">
              <i class="fa-solid fa-arrow-right"></i>
            </span>
          </a>
        </div>
      </div>
    </section>

    <!-- Design 2 : Liquid Expanding-Fill CTA -->
    <section style="background-color: #ffffff; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 2</h2>

        <div class="thha-marketing-buttons thha-presets-2">
          <a href="#" class="thha-mb-fill">
            <span class="thha-mb-fill-bg" aria-hidden="true"></span>
            <span class="thha-mb-fill-label">
              <i class="fa-solid fa-bag-shopping"></i>
              <span>Buy Now — $49</span>
            </span>
          </a>

          <a href="#" class="thha-mb-fill thha-mb-fill--pink">
            <span class="thha-mb-fill-bg" aria-hidden="true"></span>
            <span class="thha-mb-fill-label">
              <i class="fa-solid fa-download"></i>
              <span>Download App</span>
            </span>
          </a>

          <a href="#" class="thha-mb-fill thha-mb-fill--dark">
            <span class="thha-mb-fill-bg" aria-hidden="true"></span>
            <span class="thha-mb-fill-label">
              <i class="fa-solid fa-circle-play"></i>
              <span>Watch Demo</span>
            </span>
          </a>
        </div>
      </div>
    </section>

    <!-- Design 3 : Rotating Conic-Glow Border CTA -->
    <section style="background-color: #0b1020; padding: 110px 0">
      <div class="container">
        <h2 class="header-title">Design 3</h2>

        <div class="thha-marketing-buttons thha-presets-3">
          <a href="#" class="thha-mb-glow">
            <span class="thha-mb-glow-inner">
              <i class="fa-solid fa-crown"></i>
              <span>Upgrade to Pro</span>
            </span>
          </a>

          <a href="#" class="thha-mb-glow thha-mb-glow--cyan">
            <span class="thha-mb-glow-inner">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span>Get Premium</span>
            </span>
          </a>
        </div>
      </div>
    </section>

    <!-- Design 4 : Magnetic Arrow-Reveal CTA -->
    <section style="background-color: #f4f6fa; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 4</h2>

        <div class="thha-marketing-buttons thha-presets-4">
          <a href="#" class="thha-mb-magnetic">
            <span class="thha-mb-magnetic-inner">
              <span class="thha-mb-magnetic-label">Learn More</span>
              <span class="thha-mb-magnetic-circle" aria-hidden="true">
                <i class="fa-solid fa-arrow-right"></i>
                <i class="fa-solid fa-arrow-right"></i>
              </span>
            </span>
          </a>

          <a href="#" class="thha-mb-magnetic thha-mb-magnetic--solid">
            <span class="thha-mb-magnetic-inner">
              <span class="thha-mb-magnetic-label">Book a Demo</span>
              <span class="thha-mb-magnetic-circle" aria-hidden="true">
                <i class="fa-solid fa-arrow-right"></i>
                <i class="fa-solid fa-arrow-right"></i>
              </span>
            </span>
          </a>
        </div>
      </div>
    </section>

    <!-- Design 5 : Morphing State "Subscribe" CTA -->
    <section style="background-color: #f8fafc; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 5</h2>

        <div class="thha-marketing-buttons thha-presets-5">
          <button
            type="button"
            class="thha-mb-morph"
            data-state="idle"
            aria-label="Subscribe"
          >
            <span class="thha-mb-morph-state thha-mb-morph-state--idle">
              <i class="fa-solid fa-paper-plane"></i>
              <span>Subscribe Now</span>
            </span>
            <span class="thha-mb-morph-state thha-mb-morph-state--loading">
              <span class="thha-mb-morph-spinner" aria-hidden="true"></span>
            </span>
            <span class="thha-mb-morph-state thha-mb-morph-state--done">
              <i class="fa-solid fa-check"></i>
              <span>You're In!</span>
            </span>
          </button>

          <button
            type="button"
            class="thha-mb-morph thha-mb-morph--violet"
            data-state="idle"
            aria-label="Start free trial"
          >
            <span class="thha-mb-morph-state thha-mb-morph-state--idle">
              <i class="fa-solid fa-rocket"></i>
              <span>Start Free Trial</span>
            </span>
            <span class="thha-mb-morph-state thha-mb-morph-state--loading">
              <span class="thha-mb-morph-spinner" aria-hidden="true"></span>
            </span>
            <span class="thha-mb-morph-state thha-mb-morph-state--done">
              <i class="fa-solid fa-check"></i>
              <span>All Set!</span>
            </span>
          </button>
        </div>
      </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./js/marketing-buttons.js"></script>
  </body>
</html>
