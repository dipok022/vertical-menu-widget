<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Before After Slider</title>
    <link rel="stylesheet" href="./scss/before-after-slider.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Design 1 : Classic Drag Slider with Glowing Handle -->
    <section style="background-color: #0b1020; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 1</h2>

        <div class="thha-bas thha-presets-1">
          <div
            class="thha-bas-stage"
            data-bas="drag"
            data-pos="50"
            aria-label="Before and after image comparison slider"
          >
            <img
              class="thha-bas-img thha-bas-img--before"
              src="https://images.unsplash.com/photo-1505691938895-1758d7feb511?auto=format&fit=crop&w=1600&q=80"
              alt="Before"
              draggable="false"
            />
            <div class="thha-bas-after">
              <img
                class="thha-bas-img thha-bas-img--after"
                src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1600&q=80"
                alt="After"
                draggable="false"
              />
            </div>

            <span class="thha-bas-chip thha-bas-chip--before">
              <i class="fa-regular fa-image"></i> BEFORE
            </span>
            <span class="thha-bas-chip thha-bas-chip--after">
              <i class="fa-solid fa-wand-magic-sparkles"></i> AFTER
            </span>

            <div class="thha-bas-divider" aria-hidden="true">
              <span class="thha-bas-line"></span>
              <button
                type="button"
                class="thha-bas-handle"
                aria-label="Drag to compare"
              >
                <span class="thha-bas-handle-ring"></span>
                <span class="thha-bas-handle-core">
                  <i class="fa-solid fa-chevron-left"></i>
                  <i class="fa-solid fa-chevron-right"></i>
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Design 2 : Hover Reveal Wipe (no handle) -->
    <section style="background-color: #f5f5f7; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 2</h2>

        <div class="thha-bas thha-presets-2">
          <div
            class="thha-bas-stage"
            data-bas="hover"
            data-pos="50"
            aria-label="Hover to reveal after image"
          >
            <img
              class="thha-bas-img thha-bas-img--before"
              src="https://images.unsplash.com/photo-1499781350541-7783f6c6a0c8?auto=format&fit=crop&w=1600&q=80"
              alt="Before"
              draggable="false"
            />
            <div class="thha-bas-after">
              <img
                class="thha-bas-img thha-bas-img--after"
                src="https://images.unsplash.com/photo-1540206395-68808572332f?auto=format&fit=crop&w=1600&q=80"
                alt="After"
                draggable="false"
              />
            </div>

            <div class="thha-bas-tag thha-bas-tag--before">Original</div>
            <div class="thha-bas-tag thha-bas-tag--after">Edited</div>

            <div class="thha-bas-line2" aria-hidden="true"></div>

            <div class="thha-bas-hint">
              <i class="fa-solid fa-arrows-left-right"></i>
              <span>Move cursor to reveal</span>
            </div>

            <div class="thha-bas-progress" aria-hidden="true">
              <span class="thha-bas-progress-fill"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Design 3 : Spotlight Magnifier Lens -->
    <section style="background-color: #fff8f0; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 3</h2>

        <div class="thha-bas thha-presets-3">
          <div
            class="thha-bas-stage"
            data-bas="lens"
            aria-label="Move cursor to reveal after through the lens"
          >
            <img
              class="thha-bas-img thha-bas-img--before"
              src="https://images.unsplash.com/photo-1455156218388-5e61b526818b?auto=format&fit=crop&w=1600&q=80"
              alt="Before"
              draggable="false"
            />

            <div class="thha-bas-lens" aria-hidden="true">
              <div
                class="thha-bas-lens-img"
                style="
                  background-image: url('https://images.unsplash.com/photo-1500964757637-c85e8a162699?auto=format&fit=crop&w=1600&q=80');
                "
              ></div>
              <span class="thha-bas-lens-ring"></span>
              <span class="thha-bas-lens-cross"></span>
            </div>

            <span class="thha-bas-pill thha-bas-pill--before">B&W</span>
            <span class="thha-bas-pill thha-bas-pill--after">COLOR</span>

            <div class="thha-bas-cta">
              <i class="fa-solid fa-magnifying-glass-plus"></i>
              <span>Move to inspect</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Design 4 : Vertical Split Slider (top / bottom) -->
    <section style="background-color: #0d1117; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 4</h2>

        <div class="thha-bas thha-presets-4">
          <div
            class="thha-bas-stage"
            data-bas="vertical"
            data-pos="50"
            aria-label="Drag up or down to compare"
          >
            <img
              class="thha-bas-img thha-bas-img--before"
              src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=80"
              alt="Before"
              draggable="false"
            />
            <div class="thha-bas-after">
              <img
                class="thha-bas-img thha-bas-img--after"
                src="https://images.unsplash.com/photo-1431794062232-2a99a5431c6c?auto=format&fit=crop&w=1600&q=80"
                alt="After"
                draggable="false"
              />
            </div>

            <span class="thha-bas-vchip thha-bas-vchip--before">
              <i class="fa-solid fa-sun"></i> DAY
            </span>
            <span class="thha-bas-vchip thha-bas-vchip--after">
              <i class="fa-solid fa-moon"></i> NIGHT
            </span>

            <div class="thha-bas-vdivider" aria-hidden="true">
              <span class="thha-bas-vline"></span>
              <button
                type="button"
                class="thha-bas-vhandle"
                aria-label="Drag vertically"
              >
                <i class="fa-solid fa-chevron-up"></i>
                <i class="fa-solid fa-chevron-down"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Design 5 : Autoplay Showcase with Controls -->
    <section style="background-color: #eef2ff; padding: 100px 0">
      <div class="container">
        <h2 class="header-title">Design 5</h2>

        <div class="thha-bas thha-presets-5">
          <div class="thha-bas-card">
            <div class="thha-bas-card-head">
              <div class="thha-bas-card-meta">
                <span class="thha-bas-dot"></span>
                <span class="thha-bas-card-title">Retouch Showcase</span>
              </div>
              <div class="thha-bas-card-tabs" role="tablist">
                <button
                  type="button"
                  class="thha-bas-tab is-active"
                  data-tab="before"
                  role="tab"
                  aria-selected="true"
                >
                  Before
                </button>
                <button
                  type="button"
                  class="thha-bas-tab"
                  data-tab="after"
                  role="tab"
                  aria-selected="false"
                >
                  After
                </button>
              </div>
            </div>

            <div
              class="thha-bas-stage"
              data-bas="auto"
              data-pos="50"
              aria-label="Auto-playing before after comparison"
            >
              <img
                class="thha-bas-img thha-bas-img--before"
                src="https://images.unsplash.com/photo-1520975916090-3105956dac38?auto=format&fit=crop&w=1600&q=80"
                alt="Before"
                draggable="false"
              />
              <div class="thha-bas-after">
                <img
                  class="thha-bas-img thha-bas-img--after"
                  src="https://images.unsplash.com/photo-1542038784456-1ea8e935640e?auto=format&fit=crop&w=1600&q=80"
                  alt="After"
                  draggable="false"
                />
              </div>

              <span class="thha-bas-stamp thha-bas-stamp--before">RAW</span>
              <span class="thha-bas-stamp thha-bas-stamp--after">EDITED</span>

              <div class="thha-bas-autoline" aria-hidden="true">
                <span class="thha-bas-autoknob">
                  <i class="fa-solid fa-grip-lines-vertical"></i>
                </span>
              </div>
            </div>

            <div class="thha-bas-card-foot">
              <button
                type="button"
                class="thha-bas-ctrl thha-bas-ctrl--play is-playing"
                aria-label="Play / Pause"
              >
                <i class="fa-solid fa-pause thha-bas-ic-pause"></i>
                <i class="fa-solid fa-play thha-bas-ic-play"></i>
              </button>
              <div class="thha-bas-track" aria-hidden="true">
                <span class="thha-bas-track-fill"></span>
              </div>
              <button
                type="button"
                class="thha-bas-ctrl thha-bas-ctrl--reset"
                aria-label="Reset"
              >
                <i class="fa-solid fa-rotate-left"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./js/before-after-slider.js"></script>
  </body>
</html>
